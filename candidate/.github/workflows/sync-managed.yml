name: SPLRAD Steward / Sync Managed Files
on:
  workflow_dispatch:
  schedule:
    - cron: 47 2 * * 1
  push:
    branches: [main]
    paths:
      - config/**
      - templates/**
      - tools/template/**
      - scripts/**
      - copier.yml
      - schema/**
      - .github/workflows/**
      - packages/runner/dist/**
permissions:
  contents: read
  actions: read
jobs:
  bootstrap:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.STEWARD_TEMPLATE_APPLY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: steward-automation
      deployment: false
    concurrency:
      group: steward-governance-mutation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked libraries without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore protection and initialize empty repositories
        env:
          GOVERNANCE_APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          GOVERNANCE_APP_PRIVATE_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: node scripts/repository-bootstrap.mjs
  templates:
    needs: bootstrap
    if: ${{ !cancelled() && github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.STEWARD_TEMPLATE_APPLY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: steward-automation
      deployment: false
    concurrency:
      group: steward-template-delivery
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked libraries without credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          uv sync --project tools/template --frozen --no-dev
      - name: Discover and deliver native template pull requests
        env:
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: node scripts/template-delivery.mjs
