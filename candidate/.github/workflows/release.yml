name: SPLRAD Steward / Release
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-release-coordinator
  cancel-in-progress: false
jobs:
  release-coordinator:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: steward-release
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.18
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Install locked release libraries
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
      - name: business-release-coordinator
        shell: bash
        env:
          STEWARD_CENTRAL_TOKEN: ${{ github.token }}
          STEWARD_APP_PRIVATE_KEY: ${{ secrets.STEWARD_APP_PRIVATE_KEY }}
          STEWARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEWARD_CONTROLLER_SHA: ${{ github.workflow_sha }}
          STEWARD_COPILOT_TOKEN: ${{ secrets.STEWARD_COPILOT_TOKEN }}
        run: node scripts/release-coordinator.mjs

  automation-health:
    if: github.repository == 'splrad/steward' && github.repository_id == '1296724484' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    concurrency:
      group: steward-automation-health
      cancel-in-progress: false
    steps:
      - name: automation-health-native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          api() { gh api --method GET -H 'X-GitHub-Api-Version: 2026-03-10' "$1" 2>/dev/null; }
          pages() {
            local data
            data=$(gh api --method GET --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' "$1" 2>/dev/null)
            if [[ "$2" == array ]]; then jq -ce 'if all(.[]; type=="array") then add else error("pagination") end' <<<"$data"
            else jq -ce --arg field "$2" 'if length>0 and (map(.total_count)|unique|length)==1 and ($field!="workflow_runs" or .[0].total_count<1000) then .[0].total_count as $count | (map(.[$field])|add|group_by(.id)) as $groups | if ($groups|all(.[];unique|length==1)) and ($groups|length)==$count then $groups|map(first) else error("incomplete or conflicting inventory") end else error("incomplete inventory") end' <<<"$data"; fi
          }
          runs_identity() {
            jq -ce --argjson id "$1" 'if all(.[]; (.id|type)=="number" and .id>0 and (.id|floor)==.id and .workflow_id==$id and .repository.id==1296724484 and .head_repository.id==1296724484 and (.head_branch|type)=="string" and (.event|type)=="string" and (.run_attempt|type)=="number" and .run_attempt>=1 and (.created_at|type)=="string" and has("run_started_at")) then . else error("incomplete Run identity") end'
          }
          window_runs() {
            local workflow=$1 low=$2 high=$3 data count mid left right path
            path="repos/splrad/steward/actions/workflows/$workflow/runs?per_page=100&created=$(date -u -d "@$low" +%FT%TZ)..$(date -u -d "@$high" +%FT%TZ)"
            data=$(api "$path"); count=$(jq -er '.total_count' <<<"$data")
            if ((count >= 1000)); then
              ((low < high)) || return 1
              mid=$(((low+high)/2)); left=$(window_runs "$workflow" "$low" "$mid"); right=$(window_runs "$workflow" "$((mid+1))" "$high")
              jq -cen --argjson left "$left" --argjson right "$right" '$left+$right|group_by(.id)|if all(.[];unique|length==1) then map(first) else error("conflicting windows") end'
            else pages "$path" workflow_runs | runs_identity "$workflow"; fi
          }
          active_count() {
            local workflow=$1 active=0 status active_runs
            for status in requested queued in_progress waiting pending; do
              # Old queued Runs and reruns have no created lower bound.
              active_runs=$(pages "repos/splrad/steward/actions/workflows/$workflow/runs?status=$status&per_page=100" workflow_runs | runs_identity "$workflow")
              active=$((active+$(jq --arg branch "$DEFAULT_BRANCH" --argjson id "$workflow" '[.[]|select(.head_branch==$branch and .repository.id==1296724484 and .head_repository.id==1296724484 and .workflow_id==$id)]|length' <<<"$active_runs")))
            done
            printf '%s' "$active"
          }
          repo=$(api repos/splrad/steward)
          jq -e --arg branch "$DEFAULT_BRANCH" '.id==1296724484 and .full_name=="splrad/steward" and .default_branch==$branch and .archived==false and .disabled==false' <<<"$repo" >/dev/null
          current=$(api "repos/splrad/steward/actions/runs/$CURRENT_RUN_ID")
          jq -e --argjson id "$CURRENT_RUN_ID" --argjson attempt "$CURRENT_ATTEMPT" --arg branch "$DEFAULT_BRANCH" '.id==$id and .run_attempt==$attempt and .repository.id==1296724484 and .head_branch==$branch and (.event=="schedule" or .event=="workflow_dispatch")' <<<"$current" >/dev/null
          bot=$(api 'users/github-actions%5Bbot%5D' | jq -er 'select(.type=="Bot")|.id')
          marker='<!-- splrad-automation-health:v1 -->'
          find_issue() {
            pages 'repos/splrad/steward/issues?state=all&per_page=100' array |
              jq -ce --arg marker "$marker" --argjson bot "$bot" '[.[]|select(.pull_request==null and .user.id==$bot and (.body//""|startswith($marker)))]|if length<=1 then . else error("ambiguous health issue") end'
          }
          issues=$(find_issue); issue=$(jq -c '.[0]//null' <<<"$issues")
          old_body=$(jq -r '.body//""' <<<"$issue")
          previous=$(printf '%s\n' "$old_body" | sed -n 's/^<!-- health-state: \(.*\) -->$/\1/p')
          if [[ -z "$previous" ]]; then previous='[]'; fi
          now=$(date -u +%s); since=$((now-30*3600)); states='[]'
          for file in release.yml update-dependencies.yml; do
            workflow=$(api "repos/splrad/steward/actions/workflows/$file")
            workflow_id=$(jq -er --arg file ".github/workflows/$file" 'select(.path==$file)|.id' <<<"$workflow")
            state=$(jq -r '.state' <<<"$workflow"); code=HEALTHY; latest_run=null; latest_job=null; wake_unknown=false
            if [[ "$state" == disabled_inactivity ]]; then
              workflow=$(api "repos/splrad/steward/actions/workflows/$workflow_id")
              state=$(jq -r '.state' <<<"$workflow")
              if [[ "$state" == disabled_inactivity ]]; then
              gh api --method PUT -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/actions/workflows/$workflow_id/enable" >/dev/null 2>&1 || true
              workflow=$(api "repos/splrad/steward/actions/workflows/$workflow_id"); state=$(jq -r '.state' <<<"$workflow")
              fi
              if [[ "$state" != active ]]; then code=ENABLE_UNCONFIRMED; fi
            elif [[ "$state" != active ]]; then code=WORKFLOW_DISABLED; fi
            if [[ "$state" == active ]] && [[ "$(jq -r '.workflow_id' <<<"$current")" == "$workflow_id" ]]; then
              # Self-check proves only this native wake. Keep any previously observed business failure until the other workflow observes recovery.
              prior_self=$(jq -c --argjson id "$workflow_id" '[.[]|select(.workflowId==$id)]|first//null' <<<"$previous")
              if [[ "$prior_self" != null ]]; then
                code=$(jq -r '.code' <<<"$prior_self"); latest_run=$(jq '.runId' <<<"$prior_self"); latest_job=$(jq '.jobId' <<<"$prior_self"); wake_unknown=$(jq '.wakeUnknown' <<<"$prior_self")
              fi
            fi
            if [[ "$state" == active ]] && [[ "$(jq -r '.workflow_id' <<<"$current")" != "$workflow_id" ]]; then
              runs=$(window_runs "$workflow_id" "$since" "$now")
              runs=$(jq -c --argjson id "$workflow_id" --arg branch "$DEFAULT_BRANCH" '[.[]|select(.repository.id==1296724484 and .head_repository.id==1296724484 and .workflow_id==$id and .head_branch==$branch and (.event=="schedule" or .event=="workflow_dispatch"))]' <<<"$runs")
              active=$(active_count "$workflow_id")
              entries='[]'
              while IFS= read -r run; do
                run_id=$(jq -r '.id' <<<"$run")
                jobs=$(pages "repos/splrad/steward/actions/runs/$run_id/jobs?filter=all&per_page=100" jobs)
                jobs=$(jq -ce 'if all(.[]; (.id|type)=="number" and .id>0 and (.name|type)=="string" and (.run_attempt|type)=="number" and .run_attempt>=1 and (.status=="queued" or .status=="waiting" or .status=="in_progress" or .status=="completed" or .status=="pending" or .status=="requested") and has("started_at") and has("conclusion")) then group_by(.name)|map(max_by(.run_attempt)) else error("incomplete job identity") end' <<<"$jobs")
                if [[ "$file" == release.yml ]]; then
                  entry=$(jq -c '[.[]|select(.name=="release-coordinator" and .started_at!=null)]' <<<"$jobs")
                else
                  targets=$(jq -c '[.[]|select(.name=="targets")]|first//null' <<<"$jobs")
                  empty=$(jq '[.steps[]?|select(.name=="update-targets-empty" and .conclusion=="success")]|length' <<<"$targets")
                  found=$(jq '[.steps[]?|select(.name=="update-targets-found" and .conclusion=="success")]|length' <<<"$targets")
                  if ((empty==1 && found==0)); then entry=$(jq -c '[.]' <<<"$targets")
                  elif ((empty==0 && found==1)); then entry=$(jq -c '[.[]|select((.name=="update" or (.name|startswith("update ("))) and .started_at!=null)]' <<<"$jobs")
                  else entry='[]'; fi
                fi
                entries=$(jq -cn --argjson entries "$entries" --argjson entry "$entry" --argjson run "$run_id" '$entries+($entry|map(.+{source_run:$run}))')
              done < <(jq -c '.[]' <<<"$runs")
              latest=$(jq -c 'sort_by(.started_at)|last//null' <<<"$entries")
              latest_run=$(jq '.source_run' <<<"$latest"); latest_job=$(jq '.id' <<<"$latest")
              started=$(jq -er 'if length==0 then "1970-01-01T00:00:00Z" else sort_by(.created_at)|last|select(.run_started_at!=null)|.created_at end' <<<"$runs"); started_epoch=$(date -u -d "$started" +%s)
              budget=$((2*3600)); if [[ "$file" == update-dependencies.yml ]]; then budget=$((26*3600)); fi
              if ((active>0)); then code=OBSERVING
              elif [[ "$latest" == null && "$(jq length <<<"$runs")" != 0 ]]; then code=BUSINESS_EVIDENCE_UNKNOWN
              elif ((now-started_epoch > budget)); then
                code=BUSINESS_ENTRY_OVERDUE
                prior_unknown=$(jq -r --argjson id "$workflow_id" '[.[]|select(.workflowId==$id)]|first|.wakeUnknown//false' <<<"$previous")
                if ((active==0)) && [[ "$prior_unknown" != true ]]; then
                  # Recheck after the potentially long jobs scan, before dispatch.
                  workflow=$(api "repos/splrad/steward/actions/workflows/$workflow_id")
                  state=$(jq -r '.state' <<<"$workflow")
                  active=$(active_count "$workflow_id")
                  recent=$(window_runs "$workflow_id" "$now" "$(date -u +%s)")
                  if [[ "$state" != active ]] || ((active>0)) || [[ "$(jq length <<<"$recent")" != 0 ]]; then
                    code=OBSERVING
                  else
                  payload=$(jq -cn --arg ref "$DEFAULT_BRANCH" '{ref:$ref,inputs:{}}')
                  response=$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/actions/workflows/$workflow_id/dispatches" --input - <<<"$payload" 2>/dev/null) || response='{}'
                  returned=$(jq -r '.workflow_run_id//empty' <<<"$response")
                  if [[ "$returned" =~ ^[1-9][0-9]*$ ]]; then
                    observed=$(api "repos/splrad/steward/actions/runs/$returned")
                    jq -e --argjson id "$workflow_id" --argjson bot "$bot" --arg branch "$DEFAULT_BRANCH" '.workflow_id==$id and .repository.id==1296724484 and .actor.id==$bot and .event=="workflow_dispatch" and .head_branch==$branch' <<<"$observed" >/dev/null
                    code=WAKE_REQUESTED
                  else
                    # Reconcile the native window; an unknown send is never blindly repeated.
                    observed=$(window_runs "$workflow_id" "$now" "$(date -u +%s)")
                    if [[ "$(jq --argjson bot "$bot" --arg branch "$DEFAULT_BRANCH" '[.[]|select(.event=="workflow_dispatch" and .actor.id==$bot and .head_branch==$branch and .repository.id==1296724484)]|length' <<<"$observed")" == 0 ]]; then wake_unknown=true; code=WAKE_UNKNOWN; else code=WAKE_OBSERVED; fi
                  fi
                  fi
                elif [[ "$prior_unknown" == true ]] && ((active==0)); then wake_unknown=true; code=WAKE_UNKNOWN; fi
              elif [[ "$(jq --argjson run "$latest_run" 'any(.[];.source_run==$run and .status!="completed")' <<<"$entries")" == true ]]; then code=OBSERVING
              elif [[ "$(jq --argjson run "$latest_run" 'any(.[];.source_run==$run and .status=="completed" and .conclusion!="success")' <<<"$entries")" == true ]]; then code=BUSINESS_ENTRY_FAILED; fi
            fi
            states=$(jq -cn --argjson states "$states" --argjson id "$workflow_id" --arg code "$code" --argjson run "$latest_run" --argjson job "$latest_job" --argjson unknown "$wake_unknown" '$states+[{workflowId:$id,code:$code,runId:$run,jobId:$job,wakeUnknown:$unknown}]')
          done
          semantic=$(jq -c 'map({workflowId,code,wakeUnknown})' <<<"$states")
          previous_semantic=$(jq -c 'map({workflowId,code,wakeUnknown})' <<<"$previous")
          healthy=$(jq 'all(.[];.code=="HEALTHY")' <<<"$states")
          if [[ "$issue" == null && "$healthy" == true ]]; then exit 0; fi
          digest=$(printf '%s' "$semantic" | sha256sum | cut -d' ' -f1)
          transition=$(printf '%s\n%s\n%s' "$previous_semantic" "$states" "$(jq -r '.updated_at//"initial"' <<<"$issue")" | sha256sum | cut -d' ' -f1)
          comment_marker="<!-- splrad-health-transition:$transition -->"
          if [[ "$semantic" == "$previous_semantic" ]]; then
            body=$old_body
            comment_marker=$(printf '%s\n' "$old_body" | sed -n '/^<!-- splrad-health-transition:[a-f0-9]\{64\} -->$/p')
            states=$previous
          else
            body=$(printf '%s\n<!-- health-state: %s -->\n<!-- state-digest: %s -->\n%s\n\n原生入口观测：\n%s\n' "$marker" "$states" "$digest" "$comment_marker" "$states")
          fi
          if [[ "$issue" == null ]]; then
            payload=$(jq -cn --arg body "$body" '{title:"SPLRAD Automation Health",body:$body}')
            gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' repos/splrad/steward/issues --input - <<<"$payload" >/dev/null 2>&1 || true
            issue=$(find_issue | jq -c '.[0]//null'); [[ "$issue" != null ]] || exit 1
          fi
          number=$(jq -er '.number' <<<"$issue"); issue_state=open; if [[ "$healthy" == true ]]; then issue_state=closed; fi
          payload=$(jq -cn --arg body "$body" --arg state "$issue_state" '{body:$body,state:$state}')
          if [[ "$(jq -r '.body' <<<"$issue")" != "$body" || "$(jq -r '.state' <<<"$issue")" != "$issue_state" ]]; then
          gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/issues/$number" --input - <<<"$payload" >/dev/null 2>&1 || true
          fi
          readback=$(api "repos/splrad/steward/issues/$number")
          jq -e --arg body "$body" --arg state "$issue_state" '.body==$body and .state==$state' <<<"$readback" >/dev/null
          if [[ -z "$comment_marker" ]]; then exit 0; fi
          comments=$(pages "repos/splrad/steward/issues/$number/comments?per_page=100" array)
          if [[ "$(jq --arg marker "$comment_marker" --argjson bot "$bot" '[.[]|select(.user.id==$bot and (.body|startswith($marker)))]|length' <<<"$comments")" == 0 ]]; then
            payload=$(jq -cn --arg body "$comment_marker
          $states" '{body:$body}')
            gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward/issues/$number/comments" --input - <<<"$payload" >/dev/null 2>&1 || true
            pages "repos/splrad/steward/issues/$number/comments?per_page=100" array | jq -e --arg marker "$comment_marker" --argjson bot "$bot" 'any(.[];.user.id==$bot and (.body|startswith($marker)))' >/dev/null
          fi
