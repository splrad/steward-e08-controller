name: SPLRAD Steward / Native Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [e08-channel-trunk]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: native-validation-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source: ${{ steps.scope.outputs.source }}
      dependency: ${{ steps.scope.outputs.dependency }}
      docs: ${{ steps.scope.outputs.docs }}
      governance: ${{ steps.scope.outputs.governance }}
      mode: ${{ steps.scope.outputs.mode }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: mise bin-paths >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - id: scope
        run: node policy/scripts/validation-input.mjs
        env:
          VALIDATION_EVIDENCE: validation-scope.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: validation-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-scope.json
          if-no-files-found: error
  source-linux:
    name: Source linux
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: mise bin-paths >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - name: Verify source identity
        run: node policy/scripts/validation-input.mjs
      - name: Verify isolated executable controller and SDK runtime
        if: github.repository_id == '1440689456'
        working-directory: target
        shell: bash
        run: |
          node --input-type=module -e 'import {realpathSync} from "node:fs"; import {realpath} from "node:fs/promises"; import {tmpdir} from "node:os"; console.log(JSON.stringify({temp:tmpdir(),sync:realpathSync(tmpdir()),native:realpathSync.native(tmpdir()),async:await realpath(tmpdir())}));'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install vitest run packages/runner/test/governance-promotion.test.ts
          npm run typecheck
          npm run verify:config
          npm run verify:dist
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/quality-language
          npm run verify:runtime --prefix tools/quality-language
      - name: Node tests and configuration
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'node'
        working-directory: ${{ github.repository_id == '1440689456' && 'target/candidate' || 'target' }}
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run verify:config
          npm run verify:dist
      - name: Applicability
        env:
          SELECTED: ${{ needs.scope.outputs.source }}
          MODE: ${{ needs.scope.outputs.mode }}
        shell: bash
        run: printf 'source selected=%s; build interface=%s (dotnet build runs on Windows)\n' "$SELECTED" "$MODE"
  source-windows:
    name: Source windows
    needs: scope
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: mise bin-paths >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - name: Verify source identity
        run: node policy/scripts/validation-input.mjs
      - name: Verify isolated executable controller and SDK runtime
        if: github.repository_id == '1440689456'
        working-directory: target
        shell: bash
        run: |
          node --input-type=module -e 'import {realpathSync} from "node:fs"; import {realpath} from "node:fs/promises"; import {tmpdir} from "node:os"; console.log(JSON.stringify({temp:tmpdir(),sync:realpathSync(tmpdir()),native:realpathSync.native(tmpdir()),async:await realpath(tmpdir())}));'
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install vitest run packages/runner/test/governance-promotion.test.ts
          npm run typecheck
          npm run verify:config
          npm run verify:dist
          npm ci --prefix tools/quality-language --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/quality-language
          npm run verify:runtime --prefix tools/quality-language
      - name: Node tests and configuration
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'node'
        working-directory: ${{ github.repository_id == '1440689456' && 'target/candidate' || 'target' }}
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run verify:config
          npm run verify:dist
      - name: Parse PowerShell and MSBuild inputs
        if: needs.scope.outputs.source == 'true' || needs.scope.outputs.governance == 'true'
        shell: pwsh
        run: ./policy/scripts/validation-files.ps1 -Workspace ./target
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'dotnet'
        with:
          global-json-file: target/global.json
      - name: Product build
        if: needs.scope.outputs.source == 'true' && needs.scope.outputs.mode == 'dotnet'
        working-directory: target
        shell: pwsh
        run: |
          dotnet restore CADFontAutoReplace.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build CADFontAutoReplace.slnx --no-restore -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Applicability
        env:
          SELECTED: ${{ needs.scope.outputs.source }}
          MODE: ${{ needs.scope.outputs.mode }}
        shell: bash
        run: printf 'source selected=%s; build interface=%s (dotnet build runs on Windows)\n' "$SELECTED" "$MODE"
  governance:
    name: Governance scans
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: mise bin-paths >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - run: node policy/scripts/validation-governance.mjs
  dependency:
    name: Dependency review
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: needs.scope.outputs.dependency == 'true'
        with:
          base-ref: ${{ needs.scope.outputs.base }}
          head-ref: ${{ needs.scope.outputs.head }}
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          comment-summary-in-pr: never
          warn-only: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
      - name: Applicability
        if: needs.scope.outputs.dependency == 'false'
        run: echo 'dependency not-applicable; complete trusted diff contains no dependency inputs'
  docs:
    name: Documentation links
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VALIDATION_WORKSPACE: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: mise bin-paths >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - name: Install native firewall
        if: needs.scope.outputs.docs == 'true'
        run: sudo apt-get update && sudo apt-get install --yes nftables
      - run: node policy/scripts/validation-docs.mjs
        env:
          DOC_LINK_NETWORK: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && needs.scope.outputs.docs == 'true' }}
        with:
          name: doc-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: doc-link-evidence/
          if-no-files-found: warn
  summary:
    name: SPLRAD Validation
    needs: [scope, source-linux, source-windows, governance, dependency, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.10.24
          working_directory: policy
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted policy tool paths
        working-directory: policy
        shell: bash
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: mise bin-paths >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: policy
      - name: Record platform workflow provenance
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: |
          printf 'WORKFLOW_REPOSITORY=%s\nWORKFLOW_SHA=%s\nWORKFLOW_PATH=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_PATH" >> "$GITHUB_ENV"
      - run: node policy/scripts/validation-summary.mjs
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
