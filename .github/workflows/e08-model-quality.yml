name: E08 Model quality
run-name: E08 quality ${{ inputs.case_id }}
on:
  workflow_dispatch:
    inputs:
      case_id:
        type: string
        required: true
      release_revision:
        type: string
        required: true
      quality_revision:
        type: string
        required: true
      accepted_revisions:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: e08-model-quality
  cancel-in-progress: false
jobs:
  quality-summary:
    permissions:
      contents: read
      copilot-requests: write
    if: github.repository == 'splrad/steward-e08-controller' && github.repository_id
      == '1440689456' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: steward-release-notes
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Observe native token source without model requests
        env:
          STEWARD_COPILOT_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          if (!process.env.STEWARD_COPILOT_TOKEN) throw new Error('NATIVE_TOKEN_MISSING');
          const result = {
            scope: 'GitHub Actions token source observation; no Copilot service request',
            repository: process.env.GITHUB_REPOSITORY,
            ref: process.env.GITHUB_REF,
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            job: process.env.GITHUB_JOB,
            tokenPresent: true,
            modelRequests: 0
          };
          await mkdir('e08-results', { recursive: true });
          await writeFile('e08-results/quality-native-source.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: environment-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: e08-results/*.json
          if-no-files-found: error
          retention-days: 90
