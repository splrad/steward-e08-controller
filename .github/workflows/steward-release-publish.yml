name: E08 native evidence and failure budget
run-name: E08 ${{ inputs.operation_key }}
on:
  workflow_dispatch:
    inputs:
      cycle_id: {type: string, required: true}
      operation_key: {type: string, required: true}
      source_sha: {type: string, required: true}
      controller_sha: {type: string, required: true}
permissions: {}
jobs:
  synthetic-business:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward-e08-controller
          ref: b5e776e459bb9a503ca4647f816ace7028a0cbd4
          path: controller
          persist-credentials: false
      - name: business-synthetic
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ inputs.cycle_id }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          SOURCE: ${{ inputs.source_sha }}
          CONTROLLER: ${{ inputs.controller_sha }}
        run: node controller/e08-business-failure.mjs
  automation-health:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo E08_HEALTH_SUCCEEDED
